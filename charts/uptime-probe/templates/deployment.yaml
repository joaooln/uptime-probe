apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uptime-probe.fullname" . }}
  labels:
    {{- include "uptime-probe.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "uptime-probe.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uptime-probe.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PROBE_INTERVAL_SECONDS
              value: {{ .Values.probe.intervalSeconds | quote }}
            - name: PROBE_TIMEOUT_SECONDS
              value: {{ .Values.probe.timeoutSeconds | quote }}
            - name: PROBE_INITIAL_TARGETS
              value: {{ join "," .Values.probe.targets | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
