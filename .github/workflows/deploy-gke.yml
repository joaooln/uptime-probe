# Manual deploy to GKE using keyless auth (Workload Identity Federation).
# Requires `terraform apply` in infra/terraform/gke and these repository settings:
#   secrets: GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT
#   variables: GCP_PROJECT_ID, GCP_REGION, GKE_CLUSTER
name: Deploy to GKE

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GKE_CLUSTER }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GCP_REGION }}
      - name: Build and push image to Artifact Registry
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$REGISTRY/uptime-probe:${{ github.sha }}" .
          docker push "$REGISTRY/uptime-probe:${{ github.sha }}"
      - uses: azure/setup-helm@v4
      - name: Helm upgrade
        run: |
          helm upgrade --install uptime-probe charts/uptime-probe \
            --namespace uptime-probe --create-namespace \
            --set image.repository="$REGISTRY/uptime-probe" \
            --set image.tag="${{ github.sha }}" \
            --wait --timeout 5m
          kubectl -n uptime-probe rollout status deploy/uptime-probe
